# Phase 0: 最小構成
# nginxだけ起動。originは別途ホスト側で起動する前提
#
# Phase 4-A以降では Control Plane (Go) のサービスも追加される
# Phase 4-D以降では Lambda RIE 連携用の docker-compose.lambda.yml が増える

services:
  nginx:
    build: ./nginx
    container_name: cf-local-nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/njs:/etc/nginx/njs:ro
      # Phase 3-A.2 (3-5 本実装): cf-local.conf を bind mount。reload-watcher が
      # /etc/nginx/cf-local/ への MOVED_TO event を watch する。Phase 4-A 以降は
      # Control Plane (Go) container と共有 named volume で接続する形に切替。
      - ./nginx/cf-local:/etc/nginx/cf-local:ro
      - nginx-cache:/var/cache/nginx
    extra_hosts:
      # Linux で host.docker.internal を有効にする
      # macOS / Windows では無視されるが書いて問題ない
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  nginx-cache:
