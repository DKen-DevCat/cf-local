# golangci-lint v2.x configuration.
#
# Phase 5 (R-2): CI 初回実走で 43 issues 検出 (16 errcheck + 27 staticcheck)。
# 内訳:
#   - staticcheck: 26 件が SA1019 (deprecated AWS SDK v2 fields) — cf-local は
#     CloudFront API 互換のため `ForwardedValues` / `MinTTL` / `MaxTTL` / `DefaultTTL`
#     等の legacy フィールドを意図的に使う必要がある。本コードベースでは
#     "won't fix" 扱い。
#   - staticcheck: 1 件が QF1001 (De Morgan's law) — スタイル提案で機能上の
#     問題なし。
#   - errcheck: 16 件 — defer Close 等の慣用パターンも含む。一括対応は
#     phase-5 スコープを越えるため一旦 disable + 積みタスク化 (BL-CI1)。
#
# v0.2.0 で errcheck 再有効化 + 個別 fix を計画 (docs/limitations.md 参照)。

version: "2"

linters:
  default: standard
  disable:
    # 16 issues at v0.1.0; mostly `defer .Close()` / write-and-ignore patterns.
    # 個別評価して fix or `//nolint` するのは別フェーズ (BL-CI1)。
    - errcheck

  exclusions:
    rules:
      # AWS CloudFront API 互換のため deprecated SDK v2 legacy fields を
      # 意図的に使用 (ForwardedValues / MinTTL / MaxTTL / DefaultTTL /
      # Certificate / CertificateSource 等)。これらは本コードベースの責務。
      - linters: [staticcheck]
        text: "SA1019"

      # QF1001 (De Morgan's law) はスタイル提案で機能上の問題なし。
      - linters: [staticcheck]
        text: "QF1001"
