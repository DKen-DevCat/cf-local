name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build only (no GHCR push)'
        type: boolean
        default: true

# 同一 tag の多重起動を防止
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write   # GHCR push 用

jobs:
  build-and-push:
    name: Build & push (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
          # Control Plane (Go)
          - name: cf-local
            context: .
            dockerfile: Dockerfile
          # Data Plane (nginx + njs + ngx_cache_purge)
          - name: cf-local-nginx
            context: ./nginx
            dockerfile: ./nginx/Dockerfile
          # Edge Proxy sidecar (Lambda@Edge 連携用、Go)
          - name: cf-local-edge-proxy
            context: .
            dockerfile: Dockerfile.edge-proxy
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dken-devcat/${{ matrix.image.name }}
          tags: |
            # tag push (v1.2.3) → "v1.2.3" + "1.2.3" + "1.2" + "1" + "latest"
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || inputs.dry_run == false }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max
