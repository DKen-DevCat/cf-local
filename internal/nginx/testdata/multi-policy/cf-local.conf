# Generated by cf-local — do not edit by hand.

js_path "/etc/nginx/njs/";
js_import ck  from cache_key.js;
js_import ttl from ttl.js;
js_set $cf_cache_key ck.forNginx;

proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=cf_cache:100m max_size=1g inactive=7d use_temp_path=off;

upstream origin_next_app {
    server host.docker.internal:3000;
}
upstream self {
    server 127.0.0.1:8080;
}

server {
    listen 8080;

    # Invalidation purge endpoint (A.5)。Control Plane が GET /_cf_purge<path>
    # を内部発行すると、cache_key.js が cf_purge_uri を見て「<path> + default policy
    # + 空 headers/cookies/queries + AE=identity」の cache key を計算し、ngx_cache_purge
    # が当該 1 slot を消す。MVP は default policy 1 variant のみ対応 (docs/limitations.md 参照)。
    location ~ ^/_cf_purge(/.*)$ {
        allow 127.0.0.1;
        deny all;

        set $cf_policy_id "default";
        set $cf_purge_uri  $1;

        proxy_cache_purge cf_cache $cf_cache_key;
    }

    # CacheBehaviors[0]: /api/* (CachePolicyId=with-session).
    location /api/ {
        set $cf_policy_id "with-session";

        proxy_cache cf_cache;
        proxy_cache_key $cf_cache_key;
        proxy_cache_valid 200 86400s;
        proxy_cache_valid 404 10s;
        proxy_no_cache $upstream_http_x_cf_ttl_error;
        proxy_ignore_headers Set-Cookie Vary Cache-Control;

        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Cache-Key    $cf_cache_key          always;

        proxy_pass http://self/_cf_inner_with_session$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # DefaultCacheBehavior (CachePolicyId=default).
    location / {
        set $cf_policy_id "default";

        proxy_cache cf_cache;
        proxy_cache_key $cf_cache_key;
        proxy_cache_valid 200 86400s;
        proxy_cache_valid 404 10s;
        proxy_no_cache $upstream_http_x_cf_ttl_error;
        proxy_ignore_headers Set-Cookie Vary Cache-Control;

        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Cache-Key    $cf_cache_key          always;

        proxy_pass http://self/_cf_inner_default$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_cf_inner_default/ {
        allow 127.0.0.1;
        deny all;

        set $cf_policy_id "default";
        js_header_filter ttl.computeAndInject;

        proxy_pass http://origin_next_app/;
        proxy_set_header Host $host;
    }

    location /_cf_inner_with_session/ {
        allow 127.0.0.1;
        deny all;

        set $cf_policy_id "with-session";
        js_header_filter ttl.computeAndInject;

        proxy_pass http://origin_next_app/;
        proxy_set_header Host $host;
    }
}
