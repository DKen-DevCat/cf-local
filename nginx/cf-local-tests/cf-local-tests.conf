# Phase 3 A.4.10: β test endpoint 専用 server block (port 8081)。
#
# 旧 `nginx/cf-local/cf-local.conf` 内の test endpoint だけを抜き出した。
# renderer (Control Plane Go) は本ファイルを生成しない — image 焼き込みで
# `/etc/nginx/cf-local-tests/cf-local-tests.conf` に置く。base `nginx.conf`
# が `include /etc/nginx/cf-local-tests/*.conf;` で取り込む。
#
# port 8081 を別 server に切ったのは、renderer 出力の cf-local.conf が
# `listen 8080` の server block を独占するため。test mode の compose
# (`docker-compose.test.yml`) で port 8081 を expose する。
#
# 本番 mode (`docker-compose.yml` 単独) では port 8081 を expose しないので、
# test endpoint は外部から叩かれない。
#
# js_import は http context (server block の外) でのみ宣言できる。`js_path` は
# 先に include される `/etc/nginx/cf-local/cf-local.conf` (renderer 出力) 側で
# `/etc/nginx/njs/` に設定済みなのでファイル名だけで解決できる。

js_import ck_test  from cache_key.test.js;
js_import cc_test  from cache_control.test.js;
js_import ttl_test from ttl.test.js;

server {
    listen 8081;

    # Phase 1 (β) cache_key 単体テスト用 endpoint。X-Test-Policy ヘッダで policy を選択。
    location /_cache_key_test {
        js_content ck_test.endpoint;
    }

    # Phase 2-3 (β) cache_control.parse 単体テスト用 endpoint。
    location /_cache_control_test {
        js_content cc_test.endpoint;
    }

    # Phase 2-4 (β) ttl.compute 単体テスト用 endpoint。
    location /_ttl_test {
        js_content ttl_test.endpoint;
    }
}
