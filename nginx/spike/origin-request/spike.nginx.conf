# phase-4e task-1 spike: origin-request inner-hop topology (Option 2)
#
# Validates: outer proxy_cache -> inner js_content (async ngx.fetch to
# edge-proxy = origin-request fire) -> internalRedirect @origin -> origin.
# Question: does the outer proxy_cache correctly cache a response whose
# upstream (inner) is a js_content that does an async fetch + internalRedirect?
# And does origin-request fire ONLY on cache MISS?
#
# TCP self-loop (127.0.0.1:8081) instead of prod's unix socket — equivalent
# for the cache-through-js_content question, simpler for a throwaway probe.

load_module modules/ngx_http_js_module.so;
worker_processes 1;
events { worker_connections 256; }
error_log /dev/stderr info;

http {
    js_path "/etc/nginx/njs/";
    js_import spike from spike.js;
    resolver 127.0.0.11 ipv6=off valid=10s;

    proxy_cache_path /tmp/spike-cache levels=1:2 keys_zone=spike:10m use_temp_path=off;

    # outer hop = inner-A's caller. 127.0.0.1:8081 is the inner server.
    upstream self { server 127.0.0.1:8081; }

    # ---- outer: cache + proxy to inner ----
    server {
        listen 8080;
        location / {
            proxy_cache spike;
            proxy_cache_key $uri$is_args$args;
            proxy_cache_valid 200 60s;
            add_header X-Cache-Status $upstream_cache_status always;
            proxy_pass http://self;
        }
    }

    # ---- inner: inner-A (origin-request js_content) + @origin (proxy) ----
    server {
        listen 8081;

        # inner-A: fires origin-request lambda (async ngx.fetch), then
        # internalRedirect to @origin.
        location / {
            js_content spike.runOriginRequest;
        }

        # inner-B (@origin): proxy to mock origin. Variable + resolver so
        # nginx does not fail at startup if mock-origin is not yet up.
        location @origin {
            set $origin_host "mock-origin:5000";
            proxy_pass http://$origin_host;
        }
    }
}
