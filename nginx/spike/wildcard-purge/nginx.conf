# Phase 4b-0 spike: ngx_cache_purge native wildcard purge の挙動検証。
#
# 3 つの cache key 戦略を並列で立てて、`PURGE /foo*` 系の wildcard purge が
# multi-variant cache slot を一括 purge できるかを観測する。

load_module modules/ngx_http_cache_purge_module.so;

worker_processes 1;
events { worker_connections 64; }

http {
    proxy_cache_path /var/cache/nginx/z_uri_last
                     levels=1:2
                     keys_zone=z_uri_last:10m
                     max_size=64m
                     inactive=1h
                     use_temp_path=off;

    proxy_cache_path /var/cache/nginx/z_uri_front
                     levels=1:2
                     keys_zone=z_uri_front:10m
                     max_size=64m
                     inactive=1h
                     use_temp_path=off;

    proxy_cache_path /var/cache/nginx/z_uri_only
                     levels=1:2
                     keys_zone=z_uri_only:10m
                     max_size=64m
                     inactive=1h
                     use_temp_path=off;

    upstream origin_self {
        server 127.0.0.1:8086;
    }

    log_format spike '$time_local cache=$upstream_cache_status method=$request_method '
                     'uri=$request_uri cookie="$http_cookie" key="$sent_http_x_cache_key"';
    access_log /dev/stdout spike;

    # ====================================================================
    # cache 層 (port 8085)
    # ====================================================================
    server {
        listen 8085;

        # ---- Strategy A: $uri at END (README recommended) ---------------
        # proxy_cache_key "$cookie_session:$uri"
        # → 例: "alice:/foo", "bob:/foo", ":/foo" (no cookie)
        location /v1/cache/ {
            proxy_cache z_uri_last;
            proxy_cache_key "$cookie_session:$uri";
            proxy_cache_valid 200 1h;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Cache-Key    "$cookie_session:$uri" always;
            proxy_pass http://origin_self/origin/v1/;
        }
        location ~ ^/v1/purge(.*)$ {
            proxy_cache_purge z_uri_last "$cookie_session:/v1/cache$1";
        }

        # ---- Strategy B: $uri at FRONT (URI prefix) --------------------
        # proxy_cache_key "$uri:$cookie_session"
        # → 例: "/foo:alice", "/foo:bob", "/foo:" (no cookie)
        location /v2/cache/ {
            proxy_cache z_uri_front;
            proxy_cache_key "$uri:$cookie_session";
            proxy_cache_valid 200 1h;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Cache-Key    "$uri:$cookie_session" always;
            proxy_pass http://origin_self/origin/v2/;
        }
        location ~ ^/v2/purge(.*)$ {
            proxy_cache_purge z_uri_front "/v2/cache$1:$cookie_session";
        }

        # ---- Strategy C: $uri only (control / multi-variant 不能) ------
        location /v3/cache/ {
            proxy_cache z_uri_only;
            proxy_cache_key "$uri";
            proxy_cache_valid 200 1h;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Cache-Key    "$uri" always;
            proxy_pass http://origin_self/origin/v3/;
        }
        location ~ ^/v3/purge(.*)$ {
            proxy_cache_purge z_uri_only "/v3/cache$1";
        }

        # ---- Diagnostic: list cache files on disk ----------------------
        location = /diag {
            internal;
        }
    }

    # ====================================================================
    # origin 役 (port 8086, loopback only)
    # cookie session ごとに違うレスポンスを返して variant 識別を可能にする
    # ====================================================================
    server {
        listen 127.0.0.1:8086;
        location /origin/ {
            add_header Cache-Control "max-age=3600" always;
            return 200 "origin: uri=$request_uri cookie=$http_cookie\n";
        }
    }
}
