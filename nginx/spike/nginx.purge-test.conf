# Phase 3-2 spike: proxy_cache_purge ディレクティブの最小動作確認用 nginx.conf。
# 同一 nginx 内に「origin として振る舞う server」と「cache 層」を共存させる自己完結構成。

load_module modules/ngx_http_cache_purge_module.so;

worker_processes 1;
events { worker_connections 64; }

http {
    proxy_cache_path /var/cache/nginx/spike
                     levels=1:2
                     keys_zone=spike_cache:10m
                     max_size=64m
                     inactive=1h
                     use_temp_path=off;

    # cache key と purge key を揃える: URI のみ。
    # spike で確認したいのは「key=URI で cache に入った entry を、同じ key の PURGE で消せる」点。

    upstream origin_self {
        server 127.0.0.1:8082;
    }

    # cache 層 (port 8081)
    server {
        listen 8081;

        # /cache/* : 通常の GET でキャッシュさせる
        location /cache/ {
            proxy_cache spike_cache;
            proxy_cache_key $request_uri;
            proxy_cache_valid 200 1h;
            add_header X-Cache-Status $upstream_cache_status always;
            proxy_pass http://origin_self/origin/;
        }

        # /purge/* : 同 URI の cache を消す。
        # ngx_cache_purge の構文: `proxy_cache_purge <zone> <key>;`
        # request line に PURGE method を使うのが本来の作法だが、
        # spike では method 不問で発火させたいので /purge/<path> に対して
        # GET で叩く形にする (cache key は /cache/<path>)。
        location ~ ^/purge/(.*)$ {
            proxy_cache_purge spike_cache /cache/$1;
        }
    }

    # origin 役 (port 8082, loopback only)
    server {
        listen 127.0.0.1:8082;
        location /origin/ {
            add_header Cache-Control "max-age=3600" always;
            return 200 "origin response for $request_uri\n";
        }
    }
}
