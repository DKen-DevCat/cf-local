# Phase 3-5 spike: base nginx.conf。/shared/ 配下に置かれた *.conf を include。
# spike では writer container が server-vN.conf を atomic rename で書き換える。

worker_processes 1;
events { worker_connections 64; }

http {
    server {
        listen 8083;
        # /shared/*.conf を include。wildcard はファイル不在でもエラーにならない。
        # spike では writer container が active.conf を atomic rename で書き換える。
        include /shared/*.conf;

        location = /__health {
            return 200 "spike-up\n";
        }
    }
}
