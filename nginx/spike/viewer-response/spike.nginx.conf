# phase-4f task-5 spike: viewer-response transient hop topology (spike-B)
#
# Validates the transient (cache-invariant) viewer-response hop:
#  - outer location is js_content (NO proxy_cache) -> ngx.fetch inner forward
#    over the unix socket -> ngx.fetch mock-edge-proxy (viewer-response lambda)
#    -> apply headers (status unchanged) -> r.return. Outer never caches.
#  - inner /_cf_vr_fwd/ holds the proxy_cache + origin, so HIT/MISS happens
#    there. The outer hop fires on BOTH HIT and MISS (it runs every request).
# Questions:
#  (a) can outer js_content reach the inner forward (proxy_cache) over unix socket?
#  (b) does the viewer-response hook fire on cache HIT too (not just MISS)?
#  (c) is the modification transient (mock-edge-proxy invoked on every request,
#      origin fetched only once = inner MISS once)?

load_module modules/ngx_http_js_module.so;
worker_processes 1;
events { worker_connections 256; }
error_log /dev/stderr info;

http {
    js_path "/etc/nginx/njs/";
    js_import spike from spike.js;
    resolver 127.0.0.11 ipv6=off valid=10s;

    proxy_cache_path /tmp/spike-cache levels=1:2 keys_zone=spike:10m use_temp_path=off;

    upstream self { server unix:/tmp/spike-inner.sock; }

    # ---- outer: transient viewer-response hop (NO cache) ----
    server {
        listen 8080;
        location / {
            js_content spike.runViewerResponse;
        }
    }

    # ---- inner: proxy_cache + origin (the cache lives here, HIT/MISS observed) ----
    server {
        listen unix:/tmp/spike-inner.sock;
        location /_cf_vr_fwd/ {
            proxy_cache spike;
            proxy_cache_key $uri$is_args$args;
            proxy_cache_valid 200 60s;
            add_header X-Cache-Status $upstream_cache_status always;
            set $origin_host "mock-origin:5000";
            proxy_pass http://$origin_host;
        }
    }
}
