# phase-4f task-1 spike: origin-response cache-write topology (spike-A)
#
# Validates: outer proxy_cache -> inner js_content (origin fetch via unix
# socket, then async ngx.fetch to edge-proxy = origin-response fire) -> outer
# stores the modified synthetic response.
# Questions:
#  (a) can outer proxy_cache cache a js_content r.return() response?
#  (b) can njs ngx.fetch reach the inner origin proxy through a unix socket?
#  (c) does inner X-Accel-Expires affect the outer proxy_cache TTL?

load_module modules/ngx_http_js_module.so;
worker_processes 1;
events { worker_connections 256; }
error_log /dev/stderr info;

http {
    js_path "/etc/nginx/njs/";
    js_import spike from spike.js;
    resolver 127.0.0.11 ipv6=off valid=10s;

    proxy_cache_path /tmp/spike-cache levels=1:2 keys_zone=spike:10m use_temp_path=off;

    # outer hop = inner-C's caller. Use prod-like unix socket self-loop so
    # spike-A directly tests njs ngx.fetch("http://unix:...").
    upstream self { server unix:/tmp/spike-inner.sock; }

    # ---- outer: cache + proxy to inner-C ----
    server {
        listen 8080;
        location / {
            proxy_cache spike;
            proxy_cache_key $uri$is_args$args;
            proxy_cache_valid 200 60s;
            add_header X-Cache-Status $upstream_cache_status always;
            proxy_pass http://self;
        }
    }

    # ---- inner: inner-C (origin-response js_content) + inner-B (origin proxy) ----
    server {
        listen unix:/tmp/spike-inner.sock;

        # inner-C: fetches origin through inner-B, fires origin-response lambda,
        # applies response mutations, and returns the response to the outer cache.
        location / {
            js_content spike.runOriginResponse;
        }

        # inner-B: proxy to mock origin. Variable + resolver so nginx does not
        # fail at startup if mock-origin is not yet up.
        location /_cf_inner/ {
            set $origin_host "mock-origin:5000";
            proxy_pass http://$origin_host/;
        }
    }
}
