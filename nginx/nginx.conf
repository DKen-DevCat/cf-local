# Phase 2 (2-5): 2-hop パターンで X-Accel-Expires injection を駆動する。
# 1-hop では js_header_filter が cache 判定後に走るため X-Accel-Expires 注入が
# proxy_cache に届かない (phase-2-1 spike / design doc "2-1 spike 結果")。
# outer (cache 層) → inner (`/_cf_inner_default`, js_header_filter で TTL を注入)
# → origin の 3 段構成に切り替えた。

load_module modules/ngx_http_js_module.so;

worker_processes auto;
events {
    worker_connections 1024;
}

http {
    # njs ロード設定。spike を再実行したい場合は nginx/njs/spike/ttl_probe.js
    # 冒頭コメント参照。
    js_path "/etc/nginx/njs/";
    js_import ck       from cache_key.js;
    js_import ttl      from ttl.js;
    js_import ck_test  from cache_key.test.js;
    js_import cc_test  from cache_control.test.js;
    js_import ttl_test from ttl.test.js;

    # cache_key.js が後段の `proxy_cache_key` に注入する変数。
    js_set $cf_cache_key ck.forNginx;

    proxy_cache_path /var/cache/nginx
                     levels=1:2
                     keys_zone=cf_cache:100m
                     max_size=1g
                     inactive=7d
                     use_temp_path=off;

    upstream origin {
        server host.docker.internal:3000;
    }
    # 2-hop self-loop. outer から inner へは TCP loopback で渡る。Phase 4 以降で
    # unix socket 化を再検討 (design doc 2-2 アーキテクチャ確定 表)。
    upstream self {
        server 127.0.0.1:8080;
    }

    server {
        listen 8080;

        # Phase 1 (β) cache_key 単体テスト用 endpoint。tests/cache_key_test.sh が叩く。
        # X-Test-Policy ヘッダで policy を選択。
        location /_cache_key_test {
            js_content ck_test.endpoint;
        }

        # Phase 2-3 (β) cache_control.parse 単体テスト用 endpoint。
        # X-Test-CC ヘッダの値を parse() に渡して結果を JSON で返す。
        location /_cache_control_test {
            js_content cc_test.endpoint;
        }

        # Phase 2-4 (β) ttl.compute 単体テスト用 endpoint。
        # X-Test-CC + X-Test-Policy を組み合わせて整数秒を text/plain で返す。
        location /_ttl_test {
            js_content ttl_test.endpoint;
        }

        # ---- Outer: cache 層 (cache_key 計算 + cache 判定) ----------------
        location / {
            # Phase 1-4: policy_id は location 単位で固定 (複数 policy 切替は Phase 3)。
            set $cf_policy_id "default";

            proxy_cache cf_cache;
            proxy_cache_key $cf_cache_key;
            # Defense in depth: inner は常に X-Accel-Expires を inject するので
            # 通常はここに到達しない。inner failure 時の fallback として
            # CloudFront 既定の DefaultTTL=86400s に揃えてある。
            proxy_cache_valid 200 86400s;
            proxy_cache_valid 404 10s;
            # Cache-Control は inner が常に X-Accel-Expires に変換するため
            # outer 側で読む必要が無く、ignore リストから外した
            # (X-Accel-Expires が proxy_cache の TTL 判定で常に優先される)。
            # 万一 inner の injection が落ちた場合は upstream の Cache-Control
            # にフォールバックして CF 互換挙動 (max-age=0 → no cache) を保つ。
            # Set-Cookie / Vary は CloudFront 互換のため引き続き ignore
            # (後者は Phase 1-5 の Vary 修正に対応)。
            proxy_ignore_headers Set-Cookie Vary;

            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Cache-Key    $cf_cache_key          always;

            # 2-hop: 元の $request_uri を inner の prefix に prepend する。
            proxy_pass http://self/_cf_inner_default$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- Inner: TTL 注入層 (Cache-Control パース → X-Accel-Expires) ----
        # 外部から直接叩かれないよう loopback 限定。outer の `proxy_pass
        # http://self/...` は 127.0.0.1 経由なので allow 対象。Phase 4 で unix
        # socket 化したらこの allow/deny は撤去できる。
        #
        # location prefix と proxy_pass URI の trailing slash を揃えるのが要点。
        # `location /_cf_inner_default/` の matched part `/_cf_inner_default/`
        # を `proxy_pass http://origin/` の `/` で置換すると `/<x>` が origin
        # に届く。揃えないと matched part `/_cf_inner_default` が `/` に化けて
        # `//<x>` の double slash になり Next.js などの origin が 308 redirect
        # ループを起こす (Phase 2-5 の最初の試行で実機確認)。
        location /_cf_inner_default/ {
            allow 127.0.0.1;
            deny all;

            set $cf_policy_id "default";
            js_header_filter ttl.computeAndInject;

            proxy_pass http://origin/;
            # Host のみ override。X-Real-IP / X-Forwarded-For /
            # X-Forwarded-Proto は outer が既に設定したものを pass-through する
            # (nginx 既定: 明示 proxy_set_header の無い header はそのまま転送)。
            proxy_set_header Host $host;
        }
    }
}
