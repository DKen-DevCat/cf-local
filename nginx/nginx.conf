# Phase 1: njs を有効化（Phase 3 で Goスクリプトによる自動生成へ移行）
# js_path / js_import / js_set は次のサブタスク (1-4) で追加する。

load_module modules/ngx_http_js_module.so;

worker_processes auto;
events { 
    worker_connections 1024; 
}

http {
    # njs ロード設定。
    # spike を再実行したい場合は nginx/njs/spike/probe.js 冒頭コメント参照。
    js_path "/etc/nginx/njs/";
    js_import ck       from cache_key.js;
    js_import ck_test  from cache_key.test.js;
    js_import cc_test  from cache_control.test.js;
    js_import ttl_test from ttl.test.js;

    # cache_key.js が後段の `proxy_cache_key` に注入する変数。1-4 で / の location に配線する。
    js_set $cf_cache_key ck.forNginx;

    proxy_cache_path /var/cache/nginx
                     levels=1:2
                     keys_zone=cf_cache:100m
                     max_size=1g
                     inactive=7d
                     use_temp_path=off;

    upstream origin {
        server host.docker.internal:3000;
    }

    server {
        listen 8080;

        # Phase 1 (β) cache_key 単体テスト用 endpoint。tests/cache_key_test.sh が叩く。
        # X-Test-Policy ヘッダで policy を選択。
        location /_cache_key_test {
            js_content ck_test.endpoint;
        }

        # Phase 2-3 (β) cache_control.parse 単体テスト用 endpoint。
        # X-Test-CC ヘッダの値を parse() に渡して結果を JSON で返す。
        location /_cache_control_test {
            js_content cc_test.endpoint;
        }

        # Phase 2-4 (β) ttl.compute 単体テスト用 endpoint。
        # X-Test-CC + X-Test-Policy を組み合わせて整数秒を text/plain で返す。
        location /_ttl_test {
            js_content ttl_test.endpoint;
        }

        location / {
            # Phase 1-4: policy_id は location 単位で固定 (複数 policy 切替は Phase 3)。
            set $cf_policy_id "default";

            proxy_cache cf_cache;
            proxy_cache_key $cf_cache_key;
            proxy_cache_valid 200 1m;
            proxy_cache_valid 404 10s;

            # Phase 0ではoriginのCache-Controlを無視してとりあえずキャッシュ
            # Phase 2で正しいTTL決定ロジックに置き換える
            #
            # Vary も無視 (Phase 1-5): cache_key が cache identity の唯一の権威なので、
            # upstream の Vary に基づく nginx 側の追加 sub-keying は
            # 「同じ normalized AE で raw 文字列が違う」場合に誤 MISS を起こす。
            # CloudFront 互換の方針 — Vary はそのまま viewer に転送するだけ。
            proxy_ignore_headers Cache-Control Set-Cookie Vary;

            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Cache-Key    $cf_cache_key          always;

            proxy_pass http://origin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
