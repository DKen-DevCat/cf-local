# Phase 3-A.2 (3-5 本実装): base nginx.conf。http context の中身は
# `/etc/nginx/cf-local/*.conf` を include することで Control Plane (Go) から
# 動的に書き換えられる構造にした (A.4 renderer 以降)。
#
# A.4.11 で named volume `cf-local-conf` 経由配信に切替済。renderer 出力
# (`cf-local.conf` + `policies.json`) が `/etc/nginx/cf-local/` 配下に
# atomic rename で投入される。
#
# β test endpoint は `/etc/nginx/cf-local-tests/*.conf` 経由で取り込む
# (image 焼き込みファイル `nginx/cf-local-tests/cf-local-tests.conf`、
# port 8081 で別 server block)。本番 mode (`docker-compose.yml` 単独)
# では port 8081 を expose しないので外部から叩かれない。

load_module modules/ngx_http_js_module.so;
# Phase 3-A.1 (3-2 本実装): nginx-modules/ngx_cache_purge v2.5.5 を multi-stage
# build で組み込み済 (`nginx/Dockerfile`)。実発火する `proxy_cache_purge`
# location は A.5 (3-6 invalidation handler) で追加する。
load_module modules/ngx_http_cache_purge_module.so;

worker_processes auto;
events {
    worker_connections 1024;
}

http {
    # /etc/nginx/cf-local/*.conf : Control Plane が render する本番 conf (server
    # block listen 8080 + njs / upstream / outer / inner)。wildcard include は
    # ファイル不在でも nginx 起動を止めないため、初回起動時に cf-local.conf が
    # ない状態でも reload-watcher 経由で後から投入できる。
    include /etc/nginx/cf-local/*.conf;

    # /etc/nginx/cf-local-tests/*.conf : image に焼き込まれた β test endpoint 用 conf
    # (server block listen 8081)。test mode の compose だけが port 8081 を expose
    # する。renderer は本 dir を一切触らない。
    include /etc/nginx/cf-local-tests/*.conf;
}
