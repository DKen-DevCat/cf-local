# Phase 3-A.2 (3-5 本実装): base nginx.conf。http context の中身は
# `/etc/nginx/cf-local/*.conf` を include することで Control Plane (Go) から
# 動的に書き換えられる構造にした (A.4 renderer 以降)。
#
# 現フェーズでは Phase 1〜2 の挙動をそのまま再現する静的な cf-local.conf を
# bind mount 経由で配置している。

load_module modules/ngx_http_js_module.so;
# Phase 3-A.1 (3-2 本実装): nginx-modules/ngx_cache_purge v2.5.5 を multi-stage
# build で組み込み済 (`nginx/Dockerfile`)。実発火する `proxy_cache_purge`
# location は A.5 (3-6 invalidation handler) で追加する。
load_module modules/ngx_http_cache_purge_module.so;

worker_processes auto;
events {
    worker_connections 1024;
}

http {
    # /etc/nginx/cf-local/*.conf に http context のディレクティブ群 (js_*, upstream,
    # server, etc.) を切り出している。wildcard include はファイル不在でも nginx
    # 起動を止めないため、初回起動時に cf-local.conf がない状態でも reload-watcher
    # 経由で後から投入できる。
    include /etc/nginx/cf-local/*.conf;
}
